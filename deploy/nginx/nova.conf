# =====================================================================
# NOVA SPORTSBOOK - Nginx site configuration
#
# Place at /etc/nginx/sites-available/nova-sportsbook and symlink into sites-enabled.
# Replace nova.example.com with the real domain and point the certificate paths at the
# files produced by certbot (or your own CA).
#
# The application itself is a Next.js server on 127.0.0.1:3000 managed by PM2.
# Responsibilities of this layer: TLS, compression, caching of immutable assets,
# websocket upgrade for live odds, request limits and a friendly maintenance page.
# =====================================================================

upstream nova_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting zones (protect the API from abuse even before the app's own limiter).
limit_req_zone $binary_remote_addr zone=nova_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nova_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=nova_payment:10m rate=1r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nova.example.com;
    # ACME http-01 challenge, everything else goes to https
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nova.example.com;

    ssl_certificate     /etc/letsencrypt/live/nova.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nova.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (the app sets its own too; this covers error pages served by Nginx).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Never expose source maps or dotfiles.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.map$ { deny all; }

    client_max_body_size 8m;
    client_body_timeout 20s;
    keepalive_timeout 65s;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml
               image/svg+xml font/woff2 application/manifest+json;

    # Immutable Next.js build assets and static files.
    location /_next/static/ {
        proxy_pass http://nova_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?|css|js)$ {
        proxy_pass http://nova_app;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Webhooks: no rate limit bucket, but a tight body limit and no caching.
    location /api/webhooks/ {
        proxy_pass http://nova_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    # Private KYC upload allows two 8 MB documents, but no other API body grows.
    location = /api/v1/account/kyc {
        client_max_body_size 17m;
        limit_req zone=nova_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://nova_app;
        include /etc/nginx/snippets/nova-proxy.conf;
        proxy_read_timeout 60s;
        add_header Cache-Control "private, no-store";
    }

    # Money-mutating endpoints get their own (slow) bucket.
    location ~ ^/api/v1/(wallet|bets|payments)/ {
        limit_req zone=nova_payment burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://nova_app;
        include /etc/nginx/snippets/nova-proxy.conf;
        proxy_read_timeout 30s;          # money endpoints must answer quickly or be retried
        add_header Cache-Control "no-store";
    }

    location ~ ^/api/v1/auth/ {
        limit_req zone=nova_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://nova_app;
        include /etc/nginx/snippets/nova-proxy.conf;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    # Health and metrics are for the operator, not the internet.
    location /api/health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://nova_app;
        access_log off;
    }
    location /api/metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://nova_app;
        access_log off;
    }

    location /api/ {
        limit_req zone=nova_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://nova_app;
        include /etc/nginx/snippets/nova-proxy.conf;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }

    # Everything else: pages and the live-odds stream.
    location / {
        proxy_pass http://nova_app;
        include /etc/nginx/snippets/nova-proxy.conf;
        # Server-side rendering can legitimately take longer than an API call; the upgrade headers
        # are kept so a future realtime endpoint (WebSocket) works without a config change.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Maintenance: copy this file over the site and run `nginx -s reload` to pause traffic
    # without stopping the app (e.g. while a migration is being verified).
    # location / { return 503; }
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/nova;
        internal;
    }

    access_log /var/log/nginx/nova-access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/nova-error.log warn;
}
