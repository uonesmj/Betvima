name: Mobile Native API Validation
on:
  push:
    branches:
      - feature/mobile-native-api-bootstrap
    paths:
      - src/app/api/v1/mobile/**
      - src/app/api/v1/notifications/**
      - .github/workflows/mobile-native-api-validation.yml
  pull_request:
    paths:
      - src/app/api/v1/mobile/**
      - src/app/api/v1/notifications/**
      - .github/workflows/mobile-native-api-validation.yml
permissions:
  contents: read
concurrency:
  group: mobile-native-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          APP_ENV: test
          NEXT_PUBLIC_SITE_URL: https://preview.betvima.com
          NEXT_TELEMETRY_DISABLED: '1'
