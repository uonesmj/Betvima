name: BetVima Azerbaijani 179 Generate and Build
on:
  push:
    branches:
      - feat/android-179-azerbaijani-coverage-20261024
    paths:
      - '.github/workflows/android-179-azerbaijani.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate generator source
        run: python3 -m py_compile scripts/generate-azerbaijani-179.py
      - name: Translate audited Azerbaijani UI and footer resources
        run: python3 -u scripts/generate-azerbaijani-179.py
      - name: Assert full static UI and footer sections
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('android-native/app/src/main/java/com/betvima/app/ui')
          report=json.loads(pathlib.Path('azerbaijani-179-translation-audit.json').read_text())
          assert report['ui_keys']>=1200,report
          assert report['footer_articles']==4,report
          assert report['footer_sections']==42,report
          assert report['untranslated_requests']==0,report
          parts=list((root/'Azerbaijani179').glob('Azerbaijani179Part*.kt'))
          assert len(parts)>=10,len(parts)
          print('Azerbaijani audit:',report['ui_keys'],'UI source labels,',
                report['footer_sections'],'footer sections,',
                len(parts),'offline Kotlin dictionaries')
          print('Strings preserved in English (audit for brands/names):',
                report['identical_english'][:90])
          PY
      - name: Set latest Android app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-native/app/build.gradle.kts')
          s=p.read_text()
          assert 'versionCode = 178' in s
          assert 'versionName = "0.178.0"' in s
          p.write_text(s.replace('versionCode = 178','versionCode = 179')
                    .replace('versionName = "0.178.0"','versionName = "0.179.0"'))
          PY
      - name: Commit native Azerbaijani offline locale and footer documents
        run: |
          git config user.name 'betvima-android-locale-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-native/app/src/main/java/com/betvima/app/ui/Azerbaijani179/
          git add android-native/app/build.gradle.kts
          git add azerbaijani-179-translation-audit.json
          git commit -m 'feat(android): finish Azerbaijani 0.179.0 UI and 42 footer sections'
          git push origin HEAD:feat/android-179-azerbaijani-coverage-20261024
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK and test Azerbaijani translations
        working-directory: android-native
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: BetVima-Android-v0.179.0-Azerbaijani-direct-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BetVima-0.179.0-Azerbaijani-coverage-report
          path: |
            azerbaijani-179-translation-audit.json
            azerbaijani179-errors.json
          retention-days: 14
          if-no-files-found: ignore
