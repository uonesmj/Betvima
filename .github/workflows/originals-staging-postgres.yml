name: Royal Vault — Disposable PostgreSQL Atomic Wallet Validation
on:
  push:
    branches:
      - 'codex/betvima-originals-demo-20261021'
    paths:
      - 'src/server/originals/royal-vault-**'
      - 'docs/pending-financial-migrations/0219_originals_royal_vault_rounds_staging_only.sql'
      - 'tests/integration/royal-vault-staging-postgres*'
      - '.github/workflows/originals-staging-postgres.yml'
  pull_request:
    paths:
      - 'src/server/originals/royal-vault-**'
      - 'docs/pending-financial-migrations/0219_originals_royal_vault_rounds_staging_only.sql'
      - 'tests/integration/royal-vault-staging-postgres*'
      - '.github/workflows/originals-staging-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-originals-finance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-originals-only
          POSTGRES_DB: betvima_originals_staging_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d betvima_originals_staging_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: betvima_originals_staging_qa
      PGPASSWORD: disposable-originals-only
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Assert financial isolation before any SQL
        run: |
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${NEXT_PUBLIC_SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test "${PGDATABASE}" = "betvima_originals_staging_qa"
          test "${PGHOST}" = "127.0.0.1"
      - name: Install PostgreSQL client if unavailable
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Build synthetic wallet/KYC/round ledger with protected constraints
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/royal-vault-staging-postgres-fixture.sql
      - name: Exercise atomic payout, retries, KYC, concurrency and ledger reconciliation
        run: node --import tsx tests/integration/royal-vault-staging-postgres.mts
      - name: Confirm no live payment or provider credentials were used
        run: |
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${DATABASE_URL:-}"
          echo 'PASS: ephemeral PostgreSQL, entirely synthetic currency and users'
