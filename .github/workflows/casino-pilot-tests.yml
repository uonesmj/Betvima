name: Casino pilot unit and type safety
on:
  pull_request:
    paths:
      - 'src/server/providers/softaggregator/**'
      - 'src/app/api/v1/casino/demo/route.ts'
      - 'src/components/casino/casino-showcase.tsx'
      - 'tests/unit/softaggregator-*.test.ts'
      - 'tests/unit/softaggregator-*.test.js'
      - 'ops/cloudflare/softaggregator-callback-worker.js'
      - 'scripts/softaggregator-verify-signed-callback.mjs'
      - 'scripts/lib/softaggregator-offline-verifier.mjs'
      - 'vitest.config.ts'
      - '.github/workflows/casino-pilot-tests.yml'
  push:
    branches:
      - 'feature/casino-pilot-limits-20261017'
      - 'feature/casino-callback-trusted-edge-20261017'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  casino-pilot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test pilot limits and both wallet implementations
        run: npx vitest run tests/unit/softaggregator-pilot-limits.test.ts tests/unit/softaggregator-wallet.test.ts tests/unit/softaggregator-fiat-wallet.test.ts tests/unit/softaggregator-contract.test.ts tests/unit/softaggregator-edge-mode-gate.test.ts tests/unit/softaggregator-countryless-demo.test.ts tests/unit/softaggregator-launch-fields.test.ts tests/unit/softaggregator-demo-only-route.test.ts tests/unit/softaggregator-callback-edge-interoperability.test.js tests/unit/softaggregator-offline-verifier.test.js
      - name: Typecheck
        run: npm run typecheck
