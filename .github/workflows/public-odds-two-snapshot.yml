name: BetVima Public Odds Smoke (read only)
on:
  pull_request:
    paths:
      - 'scripts/public-live-odds-two-snapshot-smoke.mjs'
      - '.github/workflows/public-odds-two-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-odds-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Observe public prices twice without money/API mutations
        run: node scripts/public-live-odds-two-snapshot-smoke.mjs
        env:
          LIVE_SMOKE_WAIT_MS: '25000'
