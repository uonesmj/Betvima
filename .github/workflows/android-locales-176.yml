name: BetVima Native Locale Audit and APK 0.176.0

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-176-tr-hy-ar-complete-audit-20261023
    paths:
      - 'scripts/android-localization-audit.py'
      - '.github/workflows/android-locales-176.yml'

concurrency:
  group: betvima-locale-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan native UI text and gaps
        run: python3 scripts/android-localization-audit.py --fail-on-gaps
      - uses: actions/upload-artifact@v4
        with:
          name: locale-audit-report
          path: native-localization-audit.json
          if-no-files-found: error
          retention-days: 14
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and unit test native app
        working-directory: android-native
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: BetVima-Android-0.176.0-TR-HY-AR-debug-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
