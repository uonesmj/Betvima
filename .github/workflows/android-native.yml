name: Android Native
on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate original BetVima affiliate artwork
        run: |
          python3 -m pip install --quiet Pillow
          python3 android-native/tools/generate_affiliate_art.py
          python3 android-native/tools/refresh_affiliate_art_201.py
          # Prove the regenerated image bytes differ from v0.200.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          assets=Path('android-native/app/src/main/assets/affiliate')
          m={
              "hero": "d1bddc969b",
              "ecosystem": "7591424a3e",
              "mobile": "f7cdabaa8d",
              "casino": "e80177f5ca",
              "sports": "e80177f5ca"
          }
          for name in ['hero','ecosystem','mobile','casino','sports','faq','join','gallery_mobile','gallery_sports','gallery_casino','geography']:
              img=assets / ('bv_aff_'+name+'.webp')
              assert img.is_file() and img.stat().st_size>10000, name
              print(name, img.stat().st_size, hashlib.sha256(img.read_bytes()).hexdigest()[:16])
          PY
          test -s android-native/app/src/main/assets/affiliate/bv_aff_hero.webp
          test -s android-native/app/src/main/assets/affiliate/bv_aff_gallery_casino.webp
      - name: Build Android and run unit tests
        working-directory: android-native
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: betvima-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Verify branded APK referral is compiled into BuildConfig
        working-directory: android-native
        run: |
          gradle --no-daemon :app:generateDebugBuildConfig -PaffiliateRef=CI_PARTNER_123 --rerun-tasks
          grep -R -F 'CI_PARTNER_123' app/build/generated/source/buildConfig/debug/com/betvima/app/BuildConfig.java

