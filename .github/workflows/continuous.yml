name: Betvima Continuous Preview and Approved Production
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    paths:
      - 'ops/continuous/**'
      - '.github/workflows/continuous.yml'
      - 'src/app/api/v1/account/change-password/**'
      - 'src/app/api/v1/account/login-history/**'
      - 'src/app/api/v1/auth/login/route.ts'
      - 'src/app/auth/reset-password/**'
      - 'src/lib/auth/password-recovery.ts'
      - 'src/lib/supabase/recovery-email.ts'
      - 'src/components/account/auth-forms.tsx'
      - 'src/components/account/affiliate-login-client.tsx'
      - 'src/components/layout/providers.tsx'
      - 'tests/unit/password-recovery-link.test.ts'
      - 'src/server/adapters/postgres/notifications.ts'
      - 'src/components/layout/notifications-bell.tsx'
      - 'supabase/migrations/0216_in_app_notification_retention_24h.sql'
      - 'tests/unit/notification-24h-retention.test.ts'
  workflow_dispatch:
    inputs:
      approve_production:
        description: 'Approve production publication of this exact main revision (no migrations)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Manual owner approvals must never be evicted by later manual requests.
  # Push-based previews may still coalesce by branch.
  group: betvima-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          APP_ENV: test
          NEXT_PUBLIC_SITE_URL: https://preview.betvima.com
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Controller safety regressions
        run: |
          python3 -m pip install --disable-pip-version-check cryptography
          python3 -m unittest discover -s ops/continuous -p 'test_*.py' -v
  preview:
    needs: checks
    concurrency:
      # Preview queue is independent from owner-authorized production.
      # Both deployments still serialize on the installed server's admission lock.
      group: betvima-server-preview
      cancel-in-progress: false
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.approve_production)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish isolated preview using verified GitHub identity
        run: python3 ops/continuous/dispatch.py preview
  production:
    needs: checks
    concurrency:
      # Never let a burst of preview builds evict an approved production run.
      # Keep owner approvals ordered rather than replacing pending approvals.
      group: betvima-server-production
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.approve_production && github.actor == 'uonesmj' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish explicitly approved main revision with automatic health rollback
        run: python3 ops/continuous/dispatch.py production
