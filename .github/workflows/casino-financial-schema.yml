name: Casino Financial Schema — Isolated PostgreSQL
on:
  push:
    paths:
      - 'docs/pending-financial-migrations/02*_softaggregator_*.sql'
      - 'tests/integration/softaggregator-financial-migration-smoke.sql'
      - 'tests/integration/softaggregator-readiness-fail-closed.mts'
      - 'tests/integration/softaggregator-cash-postgres-fixture.sql'
      - 'tests/integration/softaggregator-cash-postgres-callback.mts'
      - 'src/server/providers/softaggregator/financial-readiness.ts'
      - '.github/workflows/casino-financial-schema.yml'
  pull_request:
    paths:
      - 'docs/pending-financial-migrations/02*_softaggregator_*.sql'
      - 'tests/integration/softaggregator-financial-migration-smoke.sql'
      - 'tests/integration/softaggregator-readiness-fail-closed.mts'
      - 'tests/integration/softaggregator-cash-postgres-fixture.sql'
      - 'tests/integration/softaggregator-cash-postgres-callback.mts'
      - 'src/server/providers/softaggregator/financial-readiness.ts'
      - '.github/workflows/casino-financial-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-casino-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing-only-ephemeral-no-user-money
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: testing-only-ephemeral-no-user-money
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install PostgreSQL client if unavailable
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Validate migrations and atomic audit invariants against synthetic records
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/softaggregator-financial-migration-smoke.sql
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify application schema gate on live synthetic PostgreSQL
        run: node --import tsx tests/integration/softaggregator-readiness-fail-closed.mts
      - name: Prepare isolated real-wallet-schema test fixture
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/softaggregator-cash-postgres-fixture.sql
      - name: Simulate supplier HMAC callbacks against actual PostgreSQL financial transactions
        run: node --import tsx tests/integration/softaggregator-cash-postgres-callback.mts
      - name: Assert test environment has no live supplier or wallet connection
        run: |
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${SOFTAGGREGATOR_API_PASSWORD:-}"
          echo 'PASS: isolated disposable PostgreSQL; no production wallet secrets.'
