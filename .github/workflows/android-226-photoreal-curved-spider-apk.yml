name: BetVima Android 226 Photo Spider Curved Center Debug APK
on:
  push:
    branches:
      - feat/android-226-photoreal-spider-curved-center-20261031
    paths:
      - 'android-native/**'
      - '.github/workflows/android-226-photoreal-curved-spider-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify native UI source and no financial mutations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-native/app/src/main/java/com/betvima/app/ui')
          grade = Path('android-native/app/build.gradle.kts').read_text()
          app = (p / 'BetvimaApp.kt').read_text()
          locale = (p / 'LanguagePicker.kt').read_text()
          drawer = (p / 'ReferenceMenuDrawer.kt').read_text()
          sports = (p / 'PremiumTournamentSheet.kt').read_text()
          wallet = (p / 'PremiumWallet.kt').read_text()
          affiliate = (p / 'PremiumAffiliateLanding.kt').read_text()
          reveal = (p / 'AffiliateCinematicArtwork.kt').read_text()
          casino = (p / 'CasinoLobby.kt').read_text()
          assert 'versionCode = 226' in grade and 'versionName = "0.226.0"' in grade
          assert 'onSelect = { selected -> model.setLanguage(selected) }' in app
          assert 'Icons.Default.Settings)' in drawer
          assert 'Color(0xFF111216)' in sports
          assert 'Color(0xFFF5F7FC)' in sports
          assert 'Color(0xFF1D2230)' in locale
          assert 'Active bets (loaded)' in wallet and 'Withdrawal requests use available funds' in wallet
          assert 'showing(12)' in affiliate and 'showing(16)' in affiliate
          assert 'LaunchedEffect(Unit) { revealed = true }' in reveal
          assert 'containerColor = Color(0xFF24262C)' in casino
          assert 'disabledContentColor = Color(0xFFDBE1EC)' in casino
          spider = (p / 'LossTicketSpider222.kt').read_text()
          ticket = (p / 'PremiumMyBets.kt').read_text()
          assert 'LOSS_SPIDER_DURATION_MS_222 = 3200' in spider
          assert 'LaunchedEffect(replay, badgeTarget != null)' in spider
          assert 'painterResource(R.drawable.spider_realistic_226)' in spider
          assert 'BoxWithConstraints(modifier)' in spider
          assert 'Image(' in spider and 'Canvas(' not in spider
          assert 'lossSpiderStart224' in spider and 'lossSpiderBadgeEntry224' in spider
          assert 'non-linear' in spider and 'u*u*u*start.x' in spider
          assert 'expanded && confirmedLoss && completedLossReplay != lossReplay' in ticket
          assert 'routeVariant = lossSpiderEntryIndex225(lossReplay, bet.id.hashCode())' in ticket
          image = Path('android-native/app/src/main/res/drawable/spider_realistic_226.webp')
          assert image.exists(), 'Missing actual photo sprite'
          b = image.read_bytes()
          assert len(b) > 6000 and b[:4] == b'RIFF' and b[8:12] == b'WEBP'
          win = (p / 'WinTicketSparklers.kt').read_text()
          assert 'repeat(4) { burst ->' in win
          assert 'winBurstPhase223' in win
          assert 'repeat(38) { i ->' in win
          assert 'LaunchedEffect(expanded, confirmedLoss)' not in ticket
          assert 'if (!expanded && confirmedLoss) lossReplay++' in ticket
          assert 'badge - origin' in ticket
          assert 'expanded && confirmedWin' in ticket
          print('PASS: native UI and lost-ticket one-shot animation checks')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK and run unit tests
        working-directory: android-native
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: BetVima-Android-v0.226.0-Photo-Spider-Curved-DEBUG
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish directly downloadable prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-v0.226.0-photo-spider-curved-debug-20261031"
          apk="BetVima-Android-v0.226.0-Photo-Spider-Curved-DEBUG.apk"
          cp android-native/app/build/outputs/apk/debug/app-debug.apk "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
              --prerelease --title "BetVima Android v0.226.0 - Photo Spider Curved Center (debug)" \
              --notes "BetVima Android v0.226.0 DEBUG APK. The hand-generated transparent photorealistic black spider WEBP is now the actual UI sprite, replacing every old line/dot spider drawing. Each opening starts near a distinct middle-of-card point and follows a smooth nonlinear cubic Bezier approach directly into the measured Lost status chip. Winning card particles, betting, wallet and backend unchanged. GitHub CI compiles, tests and releases preview. This is a debug-signed test build."
          fi
