name: Prune Redundant Native Locale CI 176

on:
  push:
    branches: [feat/android-176-tr-hy-ar-complete-audit-20261023]
    paths: ['.github/workflows/android-prune-locale-ci-176.yml']

permissions:
  contents: read
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep newest locale scan and cancel only redundant older scans
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          base='https://api.github.com/repos/uonesmj/Betvima'
          token=os.environ['GH_TOKEN']
          def req(url,method='GET'):
              r=urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+token,
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'},method=method)
              try:
                  with urllib.request.urlopen(r,timeout=15) as f:
                      return json.loads(f.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  print(method,url,e.code)
                  return {}
          url=base+'/actions/runs?branch=feat%2Fandroid-176-tr-hy-ar-complete-audit-20261023&per_page=100'
          runs=req(url).get('workflow_runs',[])
          candidates=sorted((x for x in runs if
              x.get('name')=='BetVima Native Locale Audit and APK 0.176.0'),
              key=lambda x:x['id'],reverse=True)
          keep=candidates[0]['id'] if candidates else None
          print('Preserving latest audit run',keep,'found',len(candidates))
          for run in candidates[1:]:
              if run['status'] not in ('completed',):
                  print('Cancelling older redundant audit',run['id'],run['status'])
                  req(base+'/actions/runs/'+str(run['id'])+'/cancel','POST')
          PY
