name: Check public BetVima mobile verification config
on:
  push:
    branches: [codex/android-signup-login-theme-turnstile-20261014]
    paths: ['.github/workflows/mobile-auth-live-probe.yml']
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify production public mobile auth config without logging credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          url = "https://betvima.com/api/v1/mobile/config"
          try:
              req = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "User-Agent": "BetVima-Auth-Healthcheck/1.0",
                  "Cache-Control": "no-cache"
              })
              with urllib.request.urlopen(req, timeout=15) as response:
                  payload = json.loads(response.read(50000))
                  status = response.status
              data = payload.get("data") if isinstance(payload.get("data"), dict) else payload
              site_key = data.get("turnstileSiteKey")
              valid = isinstance(site_key, str) and bool(re.fullmatch("[A-Za-z0-9_-]{10,160}", site_key))
              print("production HTTP status:", status)
              print("configuration ok:", payload.get("ok") is True)
              print("turnstileSiteKey field exists:", "turnstileSiteKey" in data)
              print("public site key configured:", valid)
              print("authentication configured:", data.get("authenticationConfigured"))
              if not valid:
                  raise SystemExit("Cloudflare public widget key is missing on production config; deploy the approved mobile-config revision or configure the server env.")
          except (urllib.error.URLError, ValueError) as err:
              print("public mobile auth config fetch failed:", type(err).__name__)
              raise SystemExit(1)
          PY
