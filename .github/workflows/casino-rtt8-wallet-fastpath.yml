name: Casino RTT8 Existing Wallet Fastpath
on:
  push:
    branches: [fix/casino-rtt8-wallet-fastpath-20261030]
    paths:
      - 'src/server/providers/softaggregator/wallet.ts'
      - 'tests/unit/softaggregator-wallet.test.ts'
      - 'ops/casino/stage-live-rtt8-wallet-fastpath-20261030.py'
      - 'ops/casino/build-live-rtt8-isolated-20261030.py'
      - '.github/workflows/casino-rtt8-wallet-fastpath.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate casino transactions, idempotency, KYC, debit and credit
        run: |
          npx vitest run \
            tests/unit/softaggregator-wallet.test.ts \
            tests/unit/softaggregator-fiat-wallet.test.ts \
            tests/unit/softaggregator-webhook-route.test.ts \
            tests/unit/casino-callback-transaction-routing.test.ts \
            tests/unit/casino-debit-single-timeout.test.ts
      - run: npm run typecheck
