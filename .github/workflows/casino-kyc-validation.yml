name: Account KYC validation
on:
  pull_request:
    paths:
      - 'src/app/api/v1/account/kyc/**'
      - 'src/app/api/v1/admin/kyc/**'
      - 'src/app/api/v1/admin/support/**'
      - 'src/components/admin/support-admin-client.tsx'
      - 'supabase/migrations/0215_support_attachment_private_metadata.sql'
      - 'src/app/account/kyc/**'
      - 'src/app/admin/kyc/**'
      - 'src/server/kyc/**'
      - 'src/components/account/kyc-client.tsx'
      - 'src/components/account/profile-client.tsx'
      - 'src/components/admin/kyc-reviews-client.tsx'
      - 'tests/unit/kyc-file-types.test.ts'
      - '.github/workflows/casino-kyc-validation.yml'
permissions:
  contents: read
jobs:
  verify-kyc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
        env:
          APP_ENV: test
          NEXT_PUBLIC_SITE_URL: https://preview.betvima.com
          NEXT_TELEMETRY_DISABLED: '1'

