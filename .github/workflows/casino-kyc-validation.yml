name: Casino KYC review validation
on:
  pull_request:
    paths:
      - 'src/app/api/v1/account/kyc/**'
      - 'src/app/api/v1/admin/kyc/**'
      - 'src/app/api/v1/admin/support/**'
      - 'src/components/admin/support-admin-client.tsx'
      - 'supabase/migrations/0215_support_attachment_private_metadata.sql'
      - 'src/app/api/v1/casino/**'
      - 'src/app/account/kyc/**'
      - 'src/app/admin/kyc/**'
      - 'src/server/kyc/**'
      - 'src/server/providers/softaggregator/**'
      - 'src/components/account/kyc-client.tsx'
      - 'src/components/account/profile-client.tsx'
      - 'src/components/admin/kyc-reviews-client.tsx'
      - 'src/components/casino/casino-showcase.tsx'
      - 'supabase/migrations/0214_casino_kyc_review.sql'
      - 'tests/unit/kyc-file-types.test.ts'
      - 'tests/unit/casino-kyc-eligibility.test.ts'
      - 'tests/integration/casino-kyc-postgres-smoke.sql'
      - '.github/workflows/casino-kyc-validation.yml'
permissions:
  contents: read
jobs:
  verify-kyc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
        env:
          APP_ENV: test
          NEXT_PUBLIC_SITE_URL: https://preview.betvima.com
          NEXT_TELEMETRY_DISABLED: '1'

  isolated-kyc-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kyc-ephemeral-no-real-money
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: kyc-ephemeral-no-real-money
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is installed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Run private document and single-review KYC migration smoke test
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/casino-kyc-postgres-smoke.sql
      - name: Confirm no production financial connection in isolated job
        run: |
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${SOFTAGGREGATOR_API_PASSWORD:-}"
