name: Bet placement hotfix validation

on:
  push:
    branches:
      - codex/bet-placement-odds-resume-20261012
  pull_request:
    paths:
      - 'src/components/betting/**'
      - 'src/server/services/betting-service.ts'
      - 'src/workers/odds.worker.ts'
      - 'src/workers/odds-refresh-budget.ts'
      - 'src/workers/prematch-refresh-cadence.ts'
      - 'tests/unit/prematch-refresh-cadence.test.ts'
      - 'src/lib/bet-placement-fingerprint.ts'
      - 'tests/unit/bet-placement-fingerprint.test.ts'
      - 'tests/unit/betting-service-placement.test.ts'
      - 'tests/unit/odds-refresh-budget.test.ts'
      - 'ops/hotfixes/**'
      - '.github/workflows/betting-hotfix-validation.yml'

permissions:
  contents: read

jobs:
  bet-placement-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
        env:
          APP_ENV: test
          NEXT_PUBLIC_SITE_URL: https://preview.betvima.com
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Validate dedicated live odds activation
        run: |
          python3 -m py_compile ops/hotfixes/activate-live-odds-worker.py
          python3 - <<'PY'
          from pathlib import Path
          worker = Path('src/workers/odds.worker.ts').read_text()
          domain = Path('src/domain/odds.ts').read_text()
          recovery = Path('ops/hotfixes/20261012_reopen_fresh_live_odds.sql').read_text()
          wager_guard = Path('ops/hotfixes/20261012_live_place_bet_source_freshness.sql').read_text()
          activate = Path('ops/hotfixes/activate-live-odds-worker.py').read_text()
          assert 'sourceOddsMaxAgeSeconds(market.isLive)' in worker
          assert 'ODDS_LIVE_DISCOVERY_ENABLED' in worker
          assert 'LIVE_ODDS_SOURCE_MAX_AGE_SECONDS = 45' in domain
          assert "p_provider_timestamp >= now() - interval '45 seconds'" in recovery
          assert "nova.operation_enabled('LIVE_BETTING')" in recovery
          assert "m.status::text IN ('live', 'in_play')" in recovery
          assert 'v_sel.provider_timestamp' in wager_guard
          assert 'PLACE_BET_FUNCTION_DRIFTED_ABORT' in wager_guard
          assert 'betvima-live-odds-worker' in activate
          assert 'FIVEDOLLAR_API_KEY' in activate
          PY
      - name: Guard real-money odds publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql = Path('ops/hotfixes/20261012_resume_clean_prematch_quotes.sql').read_text()
          worker = Path('src/workers/odds.worker.ts').read_text()
          service = Path('src/server/services/betting-service.ts').read_text()
          assert 'ODDS_FUNCTION_DRIFTED_ABORT' in sql
          assert 'm.status::text = \'scheduled\'' in sql
          assert 'v_market.status::text = \'open\'' in sql
          cadence = Path('src/workers/prematch-refresh-cadence.ts').read_text()
          budget = Path('src/workers/odds-refresh-budget.ts').read_text()
          assert 'prematchRefreshCadence(' in worker
          assert 'duePrematchRefreshes(' in worker
          assert 'lastPrematchByProvider' in worker
          assert 'cadence.nearLimit' in worker
          assert 'cadence.midLimit' in worker
          assert 'cadence.farLimit' in worker
          assert 'cadence.extendedLimit' in worker
          assert 'nearLimit: 16' in cadence
          assert 'midLimit: 12' in cadence
          assert 'farLimit: 12' in cadence
          assert 'extendedLimit: Math.max(1, Math.min(configuredExtendedLimit, 8))' in cadence
          assert 'maxPerCoreTick: 40' in budget
          assert 'sourceOddsMaxAgeSeconds(market.isLive)' in worker
          assert 'ODDS_NORMAL_SYNC_SKIPPED_EXTENDED' not in worker
          assert 'const normalSyncPending = pending.filter((row) => Boolean(row.provider_id))' in worker
          assert 'includeExtendedPrematchNear,' in worker
          assert 'includeExtendedPrematchFar,' in worker
          assert 'acceptOddsChange: false' in service
          PY
