name: Manual prematch validation

on:
  push:
    branches:
      - feature/manual-prematch-20261012
  pull_request:
    paths:
      - 'src/app/api/v1/admin/matches/**'
      - 'src/components/admin/matches-client.tsx'
      - 'src/server/adapters/postgres/catalog.ts'
      - 'src/server/services/betting-service.ts'
      - 'src/lib/ports/repositories.ts'
      - 'supabase/migrations/20261012_manual_prematch_safety.sql'
      - '.github/workflows/manual-prematch-ci.yml'

permissions:
  contents: read

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit

  postgres-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build representative function overloads in disposable PostgreSQL
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/manual-prematch-safety-smoke.sql
      - name: Execute manual-prematch migration on disposable PostgreSQL
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261012_manual_prematch_safety.sql
      - name: Verify migration changed the authoritative function, not the wrapper
        run: |
          psql -h localhost -U postgres -d postgres -tAc "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid WHERE n.nspname='nova' AND p.proname='place_bet' AND position('v_match.provider IS DISTINCT FROM' IN pg_get_functiondef(p.oid)) > 0 AND position('v_match.scheduled_at <= v_now' IN pg_get_functiondef(p.oid)) > 0" | grep -qx '1'
          psql -h localhost -U postgres -d postgres -tAc "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid WHERE n.nspname='nova' AND p.proname='place_bet' AND position('p_legacy' IN pg_get_function_identity_arguments(p.oid)) > 0 AND position('v_match.provider IS DISTINCT FROM' IN pg_get_functiondef(p.oid)) = 0" | grep -qx '1'
