name: Manual prematch validation

on:
  push:
    branches:
      - feature/manual-prematch-20261012
  pull_request:
    paths:
      - 'src/app/api/v1/admin/matches/**'
      - 'src/components/admin/matches-client.tsx'
      - 'src/server/adapters/postgres/catalog.ts'
      - 'src/server/services/betting-service.ts'
      - 'src/lib/ports/repositories.ts'
      - 'supabase/migrations/20261012_manual_prematch_safety.sql'
      - '.github/workflows/manual-prematch-ci.yml'

permissions:
  contents: read

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
