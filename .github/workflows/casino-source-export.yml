name: BetVima casino source ZIP export
on:
  push:
    branches: ['archive/casino-zip-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'uonesmj/Betvima'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout tracked repository source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create source-only casino archive
        run: python3 ops/casino/export_source.py
      - name: Upload casino source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BetVima-Casino-Source
          path: BetVima-Casino-Source.zip
          retention-days: 7
          if-no-files-found: error
