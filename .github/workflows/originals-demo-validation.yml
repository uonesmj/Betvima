name: BetVima Originals demo validation
on:
  pull_request:
    paths:
      - 'src/app/casino/**'
      - 'src/components/casino/originals-client.tsx'
      - 'src/lib/original-casino-demo.ts'
      - 'tests/unit/original-casino-demo.test.ts'
      - '.github/workflows/originals-demo-validation.yml'
  push:
    branches:
      - 'feature/betvima-originals-demo-20261021'
permissions:
  contents: read
jobs:
  originals-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/unit/original-casino-demo.test.ts
      - run: npm run typecheck
      - run: npm run lint
