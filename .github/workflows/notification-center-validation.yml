name: BetVima Notification Center Validation
on:
  push:
    branches: ['feature/site-notifications-20261016']
  pull_request:
    paths:
      - 'src/components/layout/notifications-bell.tsx'
      - 'src/components/admin/notifications-admin-client.tsx'
      - 'src/app/api/v1/notifications/**'
      - 'src/app/api/v1/admin/notifications/**'
      - 'supabase/migrations/0213_notification_center_welcome.sql'
      - '.github/workflows/notification-center-validation.yml'
permissions:
  contents: read
concurrency:
  group: notifications-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          APP_ENV: test
          NEXT_PUBLIC_SITE_URL: https://preview.betvima.com
          NEXT_TELEMETRY_DISABLED: '1'
