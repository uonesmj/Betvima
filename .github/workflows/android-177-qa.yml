name: Android 177 Translation Audit and APK
# Re-run after multiline locale normalization and numeric-template audit correction
on:
  push:
    branches: [feat/android-177-tr-hy-ar-native-deep-20261023]
    paths:
      - '.github/workflows/android-177-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Turkish Armenian Arabic coverage
        run: python3 scripts/android-localization-audit.py --fail-on-gaps
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and run all native tests
        working-directory: android-native
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: BetVima-Android-v0.177.0-TR-HY-AR-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BetVima-v0.177.0-Locale-Audit
          path: native-localization-audit.json
          if-no-files-found: ignore
          retention-days: 14
