name: BetVima Android 0.178.0 Locale Fixes
# Numeric percent tests also accept Turkish percent-prefix notation.

on:
  push:
    branches:
      - feat/android-178-tr-hy-ar-screenshot-fixes-20261024
    paths:
      - '.github/workflows/android-178-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Scan native Turkish Armenian Arabic keys
        run: python3 scripts/android-localization-audit.py --fail-on-gaps
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK and run localization regressions
        working-directory: android-native
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Store direct-install Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BetVima-Android-v0.178.0-screenshot-locales-debug-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BetVima-178-TR-HY-AR-Locale-QA
          path: native-localization-audit.json
          if-no-files-found: ignore
          retention-days: 14
