name: Account security API validation
on:
  pull_request:
    paths:
      - 'src/app/api/v1/account/change-password/**'
      - 'src/app/api/v1/account/login-history/**'
      - 'src/app/api/v1/auth/login/**'
      - '.github/workflows/account-security-validation.yml'
permissions:
  contents: read
jobs:
  verify-account-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
        env:
          APP_ENV: test
          NEXT_PUBLIC_SITE_URL: https://preview.betvima.com
          NEXT_TELEMETRY_DISABLED: '1'
