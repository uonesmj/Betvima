name: BetVima Android 179 Azerbaijani Final QA

on:
  push:
    branches: [feat/android-179-azerbaijani-coverage-20261024]
    paths:
      - '.github/workflows/android-179-final-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check Azerbaijani native source translations
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          ui=pathlib.Path('android-native/app/src/main/java/com/betvima/app/ui')
          report=json.loads(pathlib.Path('azerbaijani-179-translation-audit.json').read_text())
          assert report['ui_keys'] >= 1450,report
          assert report['footer_sections'] == 42,report
          assert report['footer_articles'] == 4,report
          assert report['untranslated_requests'] == 0,report
          data='\n'.join(p.read_text(encoding='utf-8') for p in (ui/'Azerbaijani179').glob('Azerbaijani179Part*.kt'))
          keys=set(re.findall(r'^\s*"((?:\\.|[^"\\])*)"\s+to\s+"',data,re.M))
          assert len(keys) >= report['ui_keys']-5,(len(keys),report['ui_keys'])
          v=(ui/'AppViewModel.kt').read_text()
          assert 'val lang: Lang = Lang.EN' in v
          assert '"az" -> Lang.AZ' in v
          footer=(ui/'PremiumAppFooter.kt').read_text()
          picker=(ui/'LanguagePicker.kt').read_text()
          assert '🇦🇿' in footer and '🇦🇿' in picker
          assert 'LocalLayoutDirection provides LayoutDirection.Ltr' in (ui/'BetvimaApp.kt').read_text()
          assert 'AzerbaijaniFooter179.article' in (ui/'FooterInformationSheet.kt').read_text()
          print('PASS: UI keys',len(keys), 'footer sections',report['footer_sections'],
                'default English, fixed LTR geometry, Azerbaijani flag and persisted locale')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and execute all native unit tests
        working-directory: android-native
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: BetVima-v0.179.0-Azerbaijani-Native-Direct-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BetVima-v0.179.0-AZ-Static-Audit
          path: azerbaijani-179-translation-audit.json
          retention-days: 14
          if-no-files-found: ignore
