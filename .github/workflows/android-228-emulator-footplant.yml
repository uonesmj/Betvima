name: BetVima 228 articulated spider Android 15 smoke
on:
  push:
    branches:
      - test/android-228-footplant-emulator-20261031
    paths:
      - 'android-native/**'
      - '.github/workflows/android-228-emulator-footplant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Render and animate all six 48-frame spider routes on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: cd android-native && gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
