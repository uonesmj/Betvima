name: VIP Cashback PostgreSQL Accounting Regression
on:
  push:
    branches:
      - 'codex/vip-cashback-financial-engine-*'
      - 'codex/vip-historical-fx-settlement-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-finance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: vip_cashback_test_only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGOPTIONS: '-c search_path=nova,public,extensions'
      PGPASSWORD: vip_cashback_test_only
      NOVA_TEST_DB: nova_vip_cashback_finance_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify PostgreSQL readiness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"
      - name: Run original VIP net weekly cashback ledger regression
        env:
          NOVA_SQL_TEST_FILTER: 31_vip_cashback_finance_test.sql
        run: bash scripts/run-sql-tests.sh
      - name: Run historical FX settlement and payout financial regression
        env:
          NOVA_SQL_TEST_FILTER: 32_vip_cashback_historical_fx_test.sql
        run: bash scripts/run-sql-tests.sh
