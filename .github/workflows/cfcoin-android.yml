name: CFCoin Android v0.2
on:
  push:
    branches:
      - cfcoin/binance-red-v0.2
    paths:
      - 'cfcoin/android/**'
      - '.github/workflows/cfcoin-android.yml'

permissions:
  contents: write

concurrency:
  group: cfcoin-native-android-v02
  cancel-in-progress: true

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build native Android APK
        working-directory: cfcoin/android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CFCoin-v0.2-debug
          path: cfcoin/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to isolated branch
        run: |
          mkdir -p cfcoin/releases
          cp cfcoin/android/app/build/outputs/apk/debug/app-debug.apk cfcoin/releases/CFCoin-v0.2-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfcoin/releases/CFCoin-v0.2-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "build(cfcoin): publish debug APK [skip ci]"
            git push origin HEAD:cfcoin/binance-red-v0.2
          fi
