name: BetVima Admin Android APK
on:
  push:
    branches: [codex/admin-native-android-v1-20261021, feat/admin-native-user-management-20261028, feat/admin-native-manual-odds-20261029]
    paths:
      - 'admin-android/**'
      - '.github/workflows/admin-android-apk.yml'
  pull_request:
    paths:
      - 'admin-android/**'
      - '.github/workflows/admin-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap command line tools and Android SDK API 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fLSs --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
            mkdir -p /tmp/android-tools-unpacked
            unzip -q /tmp/android-tools.zip -d /tmp/android-tools-unpacked
            mv /tmp/android-tools-unpacked/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify there is no embedded browser or WebView
        run: |
          if grep -R -n -E "import android\\.webkit\\.WebView|new WebView\\(|setWebViewClient\\(|\\.loadUrl\\(" admin-android/app/src/main/java; then
            echo "Native-only policy violated"; exit 1
          fi
      - name: Compile admin APK
        run: gradle -p admin-android --no-daemon --stacktrace assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: BetVima-Native-Admin-v1.3.3-APK
          path: admin-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish standalone Admin APK direct download (debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/admin-native-android-v1-20261021'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="betvima-admin-v1.3.3-direct-debug-20261029"
          apk="BetVima-Admin-v1.3.3-DEBUG.apk"
          cp admin-android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --prerelease \
              --title "BetVima Native Admin v1.3.3 (debug)" \
              --notes "Native Android admin with manual-match market and odds preview editor. Debug-signed build for testing. No customer wallet or settlement changes. If updating an APK signed with another key, Android may require removal of the old admin app before installing."
          fi
