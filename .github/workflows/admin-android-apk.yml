name: BetVima Admin Android APK
on:
  push:
    branches: [codex/admin-mobile-v1-20261021]
    paths:
      - 'admin-android/**'
      - '.github/workflows/admin-android-apk.yml'
  pull_request:
    paths:
      - 'admin-android/**'
      - '.github/workflows/admin-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile admin APK
        run: gradle -p admin-android --no-daemon --stacktrace assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: BetVima-Admin-v1.0.0-APK
          path: admin-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
