name: BetsAPI three-day trial diagnostics
on:
  pull_request:
    paths:
      - 'src/providers/betsapi-trial.ts'
      - 'src/providers/betsapi-explorer.ts'
      - 'src/providers/betsapi-bet365-preview.ts'
      - 'src/components/betsapi/**'
      - 'src/app/betsapi/**'
      - 'src/app/api/v1/betsapi/**'
      - 'tests/unit/betsapi-explorer.test.ts'
      - 'src/providers/betsapi-normalization.ts'
      - 'src/providers/betsapi-bet365-preview.ts'
      - 'src/providers/betsapi-sports.ts'
      - 'src/app/api/v1/admin/betsapi/**'
      - 'src/app/api/v1/admin/betsapi/normalized/**'
      - 'src/components/admin/providers-client.tsx'
      - 'tests/unit/betsapi-trial.test.ts'
      - 'tests/unit/betsapi-normalization.test.ts'
      - 'tests/unit/betsapi-sports.test.ts tests/unit/betsapi-explorer.test.ts'
      - '.github/workflows/betsapi-trial-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/unit/betsapi-trial.test.ts tests/unit/betsapi-normalization.test.ts tests/unit/betsapi-sports.test.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          APP_ENV: test
          NEXT_PUBLIC_SITE_URL: https://preview.betvima.com
          NEXT_TELEMETRY_DISABLED: '1'
